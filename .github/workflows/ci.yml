name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned: ubuntu-latest became 26.04 on 2026-10-19, where Playwright 1.56
    # cannot install Chromium. Move on together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    # The apt mirror behind --with-deps has stalled for ~10 minutes (2026-10-27);
    # leave room for that plus the suite.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run typecheck
      # Builds and audits dist/ for leaks, SEO and accessibility basics, links.
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # The full suite in Chromium: desktop, phone, tablets.
      - run: >-
          npx playwright test --project=desktop --project=mobile --project=tablet
          --project=android-tablet
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: |
            playwright-report
            test-results
          retention-days: 7

  engines:
    # Firefox and WebKit (desktop, iPhone, iPad): the smoke paths and navigation.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            projects: --project=firefox
          - browser: webkit
            projects: --project=webkit --project=iphone --project=ipad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test ${{ matrix.projects }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          retention-days: 7
